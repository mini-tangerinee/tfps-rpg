<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>東芳RPG探險記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 聯絡簿 grid-paper pages for login/creator; the game is a full-screen pixel campus canvas with a HUD on top and a dialog sheet at the bottom. One bright look on purpose. */
:root{
  --paper:#f7f8f3; --grid:#dfe6dc; --ink:#22303a; --muted:#5f6d73;
  --card:#ffffff; --sheet:#fffdf5; --line:#cfd8d2;
  --pen:#d23a2b; --pen-soft:#fbe4e0; --ok:#1f7a4d; --ok-soft:#dff1e7;
  --gold:#ffd84a; --gold-dk:#c79a12;
  --teach:#2a7fe0; --practice:#b07a00; --apply:#1f7a4d; --boss:#d23a2b;
  --display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--teach);outline-offset:2px}
canvas{image-rendering:pixelated}
.muted{color:var(--muted)}
.px-btn{border:2px solid var(--ink);background:var(--card);border-radius:6px;box-shadow:3px 3px 0 var(--ink);padding:8px 16px;font-family:var(--display);font-size:17px;line-height:1.3}
.px-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.px-btn.go{background:var(--gold)}
.px-btn.small{padding:4px 10px;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.px-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.tag{display:inline-block;font-size:12px;line-height:1.5;padding:0 8px;border-radius:4px;color:#fff;font-family:var(--display)}
.t-teach{background:var(--teach)} .t-practice{background:var(--practice)} .t-apply{background:var(--apply)} .t-boss{background:var(--boss)}

/* ---------- pages ---------- */
.page{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.kicker{font-size:13px;letter-spacing:.12em;color:var(--muted)}
.title{font-size:clamp(34px,9vw,48px);line-height:1.2}
.title em{font-style:normal;color:var(--pen);background:linear-gradient(transparent 62%,var(--pen-soft) 62%)}
.box{background:var(--card);border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:16px}
.badge-input{font-family:var(--mono);font-weight:700;font-size:40px;letter-spacing:.3em;text-align:center;width:6em;max-width:100%;padding:4px 0 4px .3em;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.err{color:var(--pen);min-height:1.5em;margin:0}
.login-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.creator{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:start}
.preview{display:grid;justify-items:center;gap:8px;position:sticky;top:16px}
.preview canvas{width:160px;height:190px;background:linear-gradient(#bfe3ff 0 70%,#62bb61 70%);border:2px solid var(--ink);border-radius:8px}
.opt-group{display:grid;gap:8px;padding-block:10px;border-bottom:1.5px dashed var(--line)}
.opt-group h3{font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.look{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:4px 4px 2px;display:grid;justify-items:center;font-size:12px;color:var(--muted)}
.look canvas{width:56px;height:60px}
.look[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);color:var(--ink);background:#fff8d8}
.opt{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;font-size:15px}
.sw{width:34px;height:34px;border-radius:6px;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.name-input{font-size:20px;padding:6px 12px;border:2px solid var(--ink);border-radius:8px;width:min(100%,280px);font-family:var(--body)}

/* ---------- game ---------- */
#rpg{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#2f6a35;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rhud{background:var(--paper);color:var(--ink);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:6px;border-bottom:2px solid var(--ink)}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rtop .me{display:flex;align-items:center;gap:8px;min-width:0}
.rtop .me canvas{width:36px;height:40px;flex:none}
.rtop .me b{font-family:var(--display);font-weight:400;font-size:18px}
.rtop .me small{font-family:var(--mono);color:var(--muted);font-size:13px;margin-left:6px}
.rtop .sp{flex:1}
.rtop .stars{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--gold-dk)}
.quest{display:flex;gap:10px;align-items:center;background:#fff3c4;color:#2b2410;border:2px solid #2b2410;border-radius:10px;padding:6px 12px;font-size:16px;line-height:1.35;font-weight:700}
.quest .tag{background:#2b2410;color:#fff3c4;font-size:14px;flex:none}
.quest .keys{margin-left:auto;font-weight:400;font-size:13px;color:#6a5a2a;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#2b2410;color:#fff3c4;border-radius:999px;padding:6px 16px;font-size:15px;max-width:90%;text-align:center;pointer-events:none;z-index:3}
.dlg{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--sheet);color:var(--ink);border-top:3px solid var(--ink);
  padding-block:14px 20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));box-shadow:0 -6px 20px #0004;z-index:2}
.dlg-in{max-width:860px;margin:0 auto;display:grid;gap:14px}
.sheet-head{display:flex;gap:12px;align-items:flex-start}
.sheet-head > div{flex:1;min-width:0}
.sheet-head h2{font-size:26px}
.sheet-head p{margin:4px 0 0;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);padding:10px}
.lvl:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.lvl:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;border-style:dashed}
.lvl .no{grid-row:span 3;width:40px;height:40px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:18px;border:2px solid var(--ink);border-radius:6px;background:#fff8d8}
.lvl.boss .no{background:var(--pen);color:#fff}
.lvl.next{outline:3px solid var(--gold);outline-offset:2px}
.lvl .nm{font-family:var(--display);font-size:17px;line-height:1.3}
.lvl .st{font-family:var(--mono);font-size:14px;color:var(--gold-dk);letter-spacing:.08em}

/* play */
.play-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play-head h2{font-size:21px;flex:1;min-width:0}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:3px;border:2px solid var(--muted)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--pen);border-color:var(--pen)}
.dot.now{border-color:var(--ink);background:var(--gold)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:18px clamp(14px,3vw,28px);display:grid;gap:14px}
.ask{font-size:18px;color:var(--muted)}
.target{font-size:clamp(28px,5.5vw,42px);line-height:1.5;letter-spacing:.06em;word-break:break-all;min-width:0;font-weight:500}
.target .bad-ch{color:var(--pen);text-decoration:underline wavy;text-underline-offset:8px}
.target .blank{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--gold-dk);text-align:center;color:var(--teach);margin-inline:.08em}
.target .show-name{color:var(--teach);font-family:var(--display)}
.answer-row{display:flex;gap:10px;flex-wrap:wrap}
.answer-row input{flex:1 1 240px;min-width:0;font-family:var(--body);font-size:28px;padding:6px 12px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.choice{font-size:24px;padding:12px;border-radius:8px;border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--pen);background:var(--pen-soft)}
.feedback{font-size:18px;min-height:1.5em;border-radius:8px}
.feedback.ok{color:var(--ok);font-weight:700}
.feedback.no{color:var(--pen);background:var(--pen-soft);padding:6px 10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tray{display:inline-flex;align-items:center;gap:10px;background:#202327;color:#e8eaed;font-family:"Segoe UI",system-ui,sans-serif;padding:6px 12px;border-radius:6px;font-size:15px;justify-self:start}
.tray .ime{display:grid;place-items:center;width:28px;height:28px;background:#3a3f45;border-radius:4px;font-size:17px;font-weight:600;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{background:#6b7580}}
.hint-box{background:#fff8d8;border:2px dashed var(--gold-dk);border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.hint-box h3{font-size:17px}
.combos{display:flex;flex-wrap:wrap;gap:12px 22px}
.combo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.combo .sym{font-size:26px;min-width:1.2em;text-align:center}
.combo .note{font-size:14px;color:var(--muted)}
.kc{font-family:var(--mono);font-weight:700;font-size:15px;padding:2px 9px;border-radius:5px;background:#fff;border:1.5px solid #b9b2a2;box-shadow:0 3px 0 #b9b2a2}
.kb-scroll{overflow-x:auto}
.kb{display:grid;gap:4px;min-width:560px;font-family:var(--mono)}
.kb-row{display:flex;gap:4px}
.key{flex:var(--w,1) 1 0;min-width:0;height:40px;border-radius:5px;background:#fff;border:1.5px solid #cfc7b5;position:relative;font-size:12px;color:#6a6253}
.key .k-main{position:absolute;left:5px;bottom:2px;font-size:13px;color:#2b2620}
.key .k-shift{position:absolute;left:5px;top:1px}
.key .k-zy{position:absolute;right:4px;bottom:3px;font-family:var(--body);color:#b0582f;font-size:13px}
.key.wide .k-main{font-size:11px}
.key.on{background:var(--gold);border-color:#b8952a;box-shadow:0 0 0 2px #e0a92c}
.key.on .k-main,.key.on .k-shift{color:#2b2000;font-weight:700}


.talk{display:flex;gap:14px;align-items:flex-end}
.talk > div{min-width:0}
.talk h2{font-size:26px}
.talk canvas,.score-card canvas{width:96px;height:104px;flex:none;background:linear-gradient(#bfe3ff 0 72%,#62bb61 72%);border:2px solid var(--ink);border-radius:8px}
.say{font-family:var(--display);font-size:19px;line-height:1.5;margin:6px 0 0}
.score-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center}
.score-card .big{display:grid;justify-items:center;line-height:1.2}
.score-card .big span{font-family:var(--mono);font-weight:700;font-size:46px;line-height:1;color:var(--gold-dk)}
.score-card .big small{color:var(--muted);font-size:14px}
.gain-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
@media (max-width:640px){ .score-card{grid-template-columns:auto minmax(0,1fr)} }

.rtop .loc{font-family:var(--display);font-size:15px;background:#22303a;color:#fff8d8;border-radius:6px;padding:2px 10px;white-space:nowrap}
.pk-cv{width:100%;max-width:520px;justify-self:center;border:2px solid var(--ink);border-radius:8px;image-rendering:pixelated}
.pk-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.pk-q{font-family:var(--display);font-size:30px;line-height:1.3}
.pk-score{font-family:var(--mono);font-weight:700;font-size:24px}
.pk-bar{height:12px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff}
.pk-bar span{display:block;height:100%;width:100%;background:var(--pen)}
.elev-btns{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.who-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.who-box canvas{width:120px;height:140px;background:linear-gradient(#bfe3ff 0 72%,#62bb61 72%);border:2px solid var(--ink);border-radius:8px}
.rtop .cloud{font-size:13px;color:var(--muted);white-space:nowrap}
.mg-cv{width:100%;max-width:640px;justify-self:center;border:2px solid var(--ink);border-radius:8px;touch-action:none;cursor:crosshair;background:#fff}
.mg-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:18px}
/* result */
.result{display:grid;justify-items:center;text-align:center;gap:12px;padding-block:10px}
.big-stars{display:flex;gap:10px}
.big-stars svg{width:64px;height:64px}
.big-stars svg.got{animation:pop .5s backwards}
.big-stars svg.got:nth-child(2){animation-delay:.25s}
.big-stars svg.got:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.15)}}
.result h2{font-size:30px}
.result p{margin:0}
.result .actions{justify-content:center}
.rv-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rv-item{border:2px solid var(--line);border-radius:8px;padding:2px 12px;font-size:17px}
.rv-item.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.rv-item.no{border-color:var(--pen);color:var(--pen);background:var(--pen-soft)}
.medals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.medal{display:grid;justify-items:center;gap:2px;font-size:14px;color:var(--muted);text-align:center}
.medal .disc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;border:2.5px dashed var(--line);color:var(--muted);background:#fff}
.medal.lv1 .disc{background:#d9925f;border:2.5px solid var(--ink);color:#3b2212}
.medal.lv2 .disc{background:#d3dadd;border:2.5px solid var(--ink);color:#26323a}
.medal.lv3 .disc{background:var(--gold);border:2.5px solid var(--ink);color:#4a3500}
.medal b{color:var(--ink);font-weight:500}

@media (max-width:640px){
  .creator{grid-template-columns:minmax(0,1fr)}
  .preview{position:static}
  .quest .keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<div id="app"></div>
<div id="rpg" hidden>
  <div class="rhud">
    <div class="rtop">
      <div class="me"><canvas id="hud-av" width="36" height="40"></canvas><span><b id="hud-name"></b><small id="hud-badge"></small></span></div>
      <span class="loc" id="hud-loc"></span>
      <span class="sp"></span>
      <span class="cloud" id="hud-cloud" hidden></span>
      <span class="stars" id="hud-stars"></span>
      <button class="px-btn small go" id="hud-session"></button>
      <button class="px-btn small" id="hud-medal">勳章・寶箱</button>
      <button class="px-btn small" id="hud-teacher" hidden>老師工具</button>
      <button class="px-btn small" id="hud-edit">換造型</button>
      <button class="px-btn small" id="hud-out">換人</button>
    </div>
    <div class="quest"><span class="tag">任務</span><span id="qt"></span><span class="keys">點地圖、方向鍵或 WASD 走路・按住空白鍵衝刺</span></div>
  </div>
  <div class="stage">
    <canvas id="cv" aria-label="東芳國小校園地圖。點地圖或用方向鍵讓角色走路，走到建築物門口就能闖關。"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="dlg" id="dlg" hidden><div class="dlg-in" id="dlg-in"></div></div>
  </div>
</div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const starText = n => '★'.repeat(n) + '☆'.repeat(3-n);
const STAR = (on, size=64) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.6.7-5 4.5 1.4 6.6L12 17.2l-5.9 3.3 1.4-6.6-5-4.5 6.6-.7z" fill="${on?'#ffd84a':'#fff'}" stroke="#22303a" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const todayKey = () => { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function weekKey(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(d.getFullYear(),0,4); return d.getFullYear()+'W'+(1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)); }

/* ============ storage ============ */
const KEY = 'dongfang-keyboard-quest-v1';
let MEM = {players:{}};
function load(){ try{ const s = localStorage.getItem(KEY); if(s) MEM = JSON.parse(s) || MEM; }catch(e){} if(!MEM.players) MEM.players = {}; }
function save(){ if(me) me.updated=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(MEM)); }catch(e){} markDirty(); }
load();

/* ============ cloud save (Google 試算表) ============ */
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbyFZfdwVQcSKiVF4uCqBTWvwfXqe5wDjr3np_c8YoNfy61LGyzRa7njbuuoTGSTywBeXw/exec';   // Apps Script 網頁應用程式網址（…/exec）
const CLOUD = { on: /^https:\/\/script\.google(usercontent)?\.com\//.test(CLOUD_URL), timer:0, busy:false, status:'', retry:0 };
const PKEY = KEY + '-pending';
function pendingGet(){ try{ const o=JSON.parse(localStorage.getItem(PKEY)||'null'); if(o && o.dirty && o.logs) return o; }catch(e){} return {dirty:[], logs:[]}; }
function pendingSet(o){ try{ localStorage.setItem(PKEY, JSON.stringify(o)); }catch(e){} }
let PEND = pendingGet();
function cloudStatus(s){ CLOUD.status=s; const el=document.getElementById('hud-cloud'); if(el){ el.hidden=!CLOUD.on; el.textContent=s; } }
function markDirty(){
  if(!CLOUD.on || !me || me.teacher || !badgeNow) return;
  if(!PEND.dirty.includes(badgeNow)) PEND.dirty.push(badgeNow);
  pendingSet(PEND); clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(cloudFlush, 1500);
}
function taipeiNow(){ try{ return new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}); }catch(e){ return new Date().toISOString(); } }
function cloudLog(row){
  if(!CLOUD.on || !me || me.teacher) return;
  PEND.logs.push({time:taipeiNow(), badge:badgeNow, name:me.name, ...row});
  markDirty();
}
function starsOf(p,id){ return (p.stars||{})[id]||0; }
function summaryOf(b,p){
  const total=ALL_LEVELS.reduce((s,l)=>s+starsOf(p,l.id),0), done=ALL_LEVELS.filter(l=>starsOf(p,l.id)>0).length;
  const medals=Object.values(p.medals||{}).reduce((s,a)=>s+Math.min(3,a.length),0);
  const wrong=Object.entries(p.wrong||{}).filter(([k,v])=>v>=1).sort((a,c)=>c[1]-a[1]).slice(0,3).map(([k,v])=>`${k}${SYMNAME[k]||''}×${Math.round(v)}`).join('、');
  let next='全部完成';
  for(const z of ZONES){ if(z.soon) continue; const l=z.levels.find(l=>starsOf(p,l.id)===0); if(l){ next=`區${z.no} ${z.bld}・${l.name}`; break; } }
  return {badge:b, grade:b[0], name:p.name||'', total, max:ALL_LEVELS.length*3, done, levels:ALL_LEVELS.length, chests:(p.treasures||[]).length, medals, pk:(p.pkBest==null?'':p.pkBest), next, wrong};
}
const CHEST_PLACE = {c1:'通學步道',c2:'籃球場',c3:'迎曦樓1樓廁所',c4:'幼兒園遊樂區',c5:'東芳樓1樓圖書室',c6:'資源回收區',c7:'芳星樓2樓二孝',c8:'樂學樓2樓教師休息室',c9:'右邊停車場',c10:'東芳樓3樓自然'};
function detailOf(b,p){
  const head=['胸牌','名字'], row=[b, p.name||''];
  for(const z of ZONES) z.levels.forEach((l,i)=>{ head.push(`區${z.no}-${i+1} ${l.name}`); row.push(starsOf(p,l.id)); });
  const tr=(p.treasures||[]);
  head.push('寶箱數量','開過的寶箱'); row.push(tr.length, tr.map(id=>CHEST_PLACE[id]||id).join('、'));
  for(const [sym] of MEDAL_SYMS){ const n=Math.min(3,((p.medals||{})[sym]||[]).length); head.push(`勳章 ${sym==='（）'?'括號':SYMNAME[sym]}`); row.push(['','銅','銀','金'][n]); }
  head.push('PK最佳','累計踢進','累計投進'); row.push(p.pkBest==null?'':p.pkBest, p.goalsTotal||0, p.basketsTotal||0);
  return {head,row};
}
function sessionOf(p){
  const s=p.session; if(!s) return null;
  const s0=s.stars0||{}, gained=ALL_LEVELS.reduce((t,l)=>t+Math.max(0,starsOf(p,l.id)-(s0[l.id]||0)),0);
  let start=''; try{ start=new Date(s.start).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}); }catch(e){ start=String(s.start); }
  return {start, stars:gained, chests:(s.chests||[]).length};
}
async function cloudPost(body, ms=15000){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(), ms);
  try{
    const r=await fetch(CLOUD_URL,{method:'POST', body:JSON.stringify(body), signal:ctl.signal});
    const j=await r.json(); if(!j.ok) throw new Error(j.msg||'雲端回傳錯誤'); return j;
  } finally { clearTimeout(t); }
}
async function cloudLoad(b){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(), 10000);
  try{ const r=await fetch(CLOUD_URL+'?action=load&badge='+encodeURIComponent(b),{signal:ctl.signal}); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function cloudFlush(){
  if(!CLOUD.on || CLOUD.busy) return;
  if(!PEND.dirty.length && !PEND.logs.length){ cloudStatus('☁ 已存到雲端'); return; }
  CLOUD.busy=true; cloudStatus('☁ 存檔中…');
  try{
    while(PEND.dirty.length || PEND.logs.length){
      const b = PEND.dirty[0] || PEND.logs[0].badge, p = MEM.players[b];
      const logs = PEND.logs.filter(l=>l.badge===b).slice(0,40);
      const body = {action:'sync', badge:b, logs};
      if(p){ body.player=p; body.summary=summaryOf(b,p); body.session=sessionOf(p); body.detail=detailOf(b,p); }
      await cloudPost(body);
      PEND.logs = PEND.logs.filter(l=>!logs.includes(l));
      if(!PEND.logs.some(l=>l.badge===b)) PEND.dirty = PEND.dirty.filter(x=>x!==b);
      pendingSet(PEND);
    }
    CLOUD.retry=0; cloudStatus('☁ 已存到雲端');
  }catch(e){
    CLOUD.retry=Math.min(CLOUD.retry+1,6); cloudStatus('⚠ 暫存在這台電腦，稍後再上傳');
    clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(cloudFlush, 8000*CLOUD.retry);
  }finally{ CLOUD.busy=false; }
}
window.addEventListener('online', ()=>{ if(CLOUD.on) cloudFlush(); });
function mergePlayers(a,b){
  if(!a) return b||null; if(!b) return a;
  const out={...a, ...b};
  out.name=b.name||a.name; out.avatar=b.avatar||a.avatar;
  out.stars={...a.stars}; for(const [k,v] of Object.entries(b.stars||{})) out.stars[k]=Math.max(v,out.stars[k]||0);
  out.wrong={...a.wrong}; for(const [k,v] of Object.entries(b.wrong||{})) out.wrong[k]=Math.max(v,out.wrong[k]||0);
  out.treasures=[...new Set([...(a.treasures||[]),...(b.treasures||[])])];
  out.medals={}; for(const k of new Set([...Object.keys(a.medals||{}),...Object.keys(b.medals||{})])) out.medals[k]=[...new Set([...((a.medals||{})[k]||[]),...((b.medals||{})[k]||[])])];
  out.reviewDay = [a.reviewDay,b.reviewDay].filter(Boolean).sort().pop()||null;
  out.pkBest = Math.max(a.pkBest??-1, b.pkBest??-1); if(out.pkBest<0) out.pkBest=null;
  out.session = (a.session?.start||0) > (b.session?.start||0) ? a.session : b.session;
  out.goalsTotal = Math.max(a.goalsTotal||0, b.goalsTotal||0); out.basketsTotal = Math.max(a.basketsTotal||0, b.basketsTotal||0);
  return out;
}

/* ============ pixel person ============ */
const HAIRS = [['short','短髮'],['spiky','刺刺頭'],['bob','妹妹頭'],['pony','馬尾'],['long','長髮'],['buns','丸子頭']];
const HAIRC = [['#2b2320','黑'],['#6b4428','咖啡'],['#e0802f','橘'],['#3f6fd1','藍'],['#9a5fd0','紫'],['#e2c25a','金']];
const SKINS = ['#f6d3b3','#ebbd96','#cf966a','#8f5d3c'];
const SHIRTS = ['#e8574a','#f2a03d','#f2cf3b','#4cb36a','#3f8fe0','#8f6ad8','#ef7fae','#f4f4f0'];
const PANTS = ['#2f3b4c','#3b3550','#5b4636','#2f5a8a','#6b6b6b'];
const ACCS = [['none','沒有'],['glasses','眼鏡'],['cap','棒球帽'],['phones','耳機']];
const DEFAULT_LOOK = {hair:'short', hairC:0, skin:0, shirt:4, pants:0, acc:'none'};
function lookColors(a){ return {hair:a.hair, H:HAIRC[a.hairC][0], skin:SKINS[a.skin], shirt:SHIRTS[a.shirt], pants:PANTS[a.pants], acc:a.acc}; }
/* 16-unit sprite; (x,y) is the bottom-left corner */
function drawPerson(c,x,y,u,look,o={}){
  const L = look.H ? look : lookColors(look);
  const f = o.frame||0, dark='#22303a', H=L.H, skin=L.skin;
  const R=(a,b,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x+a*u),Math.round(y+(b-16)*u),Math.ceil(w*u),Math.ceil(h*u))};
  if(!o.noShadow){ c.fillStyle='rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(x+8*u,y-.6*u,5*u,1.3*u,0,0,7); c.fill(); }
  if(L.hair==='long') R(3,3,10,7.5,H);
  if(L.hair==='pony'){ R(12,2,2,2,H); R(13,4,1.6,5,H); R(12.2,2.8,1.4,1,'#ef7fae'); }
  if(L.hair==='buns'){ R(2.5,0,2.6,2.6,H); R(10.9,0,2.6,2.6,H); }
  if(!L.wheel){ R(5,12+(f?1:0),2,3-(f?1:0),L.pants); R(9,12+(f?0:1),2,3-(f?0:1),L.pants);
  R(5,15,2,1,dark); R(9,15,2,1,dark); }
  R(4,8,8,5,L.shirt);
  R(3,8+(f?.5:0),1,4,L.shirt); R(12,8+(f?0:.5),1,4,L.shirt);
  R(3,12+(f?.5:0),1,1,skin); R(12,12+(f?0:.5),1,1,skin);
  R(8.8,9,2.4,1.4,'#ffffff'); R(8.8,9,2.4,.35,'#d23a2b');
  R(4,2,8,6,skin);
  switch(L.hair){
    case 'short': R(4,1,8,2,H); R(4,3,1,2,H); R(11,3,1,2,H); break;
    case 'spiky': R(4,1,8,2,H); R(5,0,1,1,H); R(7,-.5,1.2,1.5,H); R(9,0,1,1,H); R(10.5,-.4,1,1.4,H); R(4,3,1,1,H); R(11,3,1,1,H); break;
    case 'bob': R(4,1,8,2,H); R(3,2,2,6.5,H); R(11,2,2,6.5,H); R(4,3,3,1,H); break;
    case 'long': R(3,1,10,2,H); R(3,3,2,7,H); R(11,3,2,7,H); break;
    case 'pony': case 'buns': R(4,1,8,2,H); R(4,3,1,1,H); R(11,3,1,1,H); break;
  }
  const m = o.mood||'idle';
  R(6,4.6,1,1.2,dark); R(9,4.6,1,1.2,dark);
  R(5,6,1,.6,'#f3a0a8'); R(10,6,1,.6,'#f3a0a8');
  if(m==='ok'){ R(6.5,6.4,3,.8,dark); R(6,6,1,.6,dark); R(9,6,1,.6,dark); }
  else if(m==='bad'){ R(7,6.4,2,1.2,dark); R(13,1,1,2,'#7cc4ee'); }
  else R(7,6.6,2,.7,dark);
  if(L.acc==='glasses'){ c.strokeStyle=dark; c.lineWidth=Math.max(1,u*.45); c.strokeRect(x+5.2*u,y-11.8*u,2.6*u,2.2*u); c.strokeRect(x+8.2*u,y-11.8*u,2.6*u,2.2*u); }
  if(L.acc==='cap'){ R(4,.4,8,2.4,L.shirt); R(9,2.4,4.6,1,dark); R(4,2.4,8,.4,'rgba(0,0,0,.25)'); }
  if(L.acc==='phones'){ R(4,.2,8,.8,'#3a3f4a'); R(3,3,1.6,3,'#3a3f4a'); R(11.4,3,1.6,3,'#3a3f4a'); }
  if(L.wheel){
    R(2.6,8,1,4.6,'#5a6470'); R(3,12.2,9,.9,'#5a6470');
    R(6,12.6,6,1.4,L.pants); R(11,13.4,1.4,2,L.pants); R(11,15,2.2,1,dark);
    c.strokeStyle='#2a2f36'; c.lineWidth=Math.max(1.5,u*.9); c.beginPath(); c.arc(x+6.5*u,y-3*u,2.8*u,0,7); c.stroke();
    c.strokeStyle='#9aa3ab'; c.lineWidth=Math.max(1,u*.35); c.beginPath(); c.arc(x+6.5*u,y-3*u,1.8*u,0,7); c.stroke();
    c.fillStyle='#9aa3ab'; c.fillRect(x+6.1*u,y-3.4*u,.8*u,.8*u);
    c.fillStyle='#2a2f36'; c.beginPath(); c.arc(x+12.4*u,y-.9*u,.9*u,0,7); c.fill();
  }
}

/* ============ player state ============ */
let me = null, badgeNow = null;
const stars = id => (me && me.stars[id]) || 0;
function levelOpen(lv){
  if(me.teacher) return true;
  const z = lv.zone; if(!zoneOpen(z)) return false;
  const i = z.levels.indexOf(lv); return i===0 || stars(z.levels[i-1].id) >= 1;
}
function zoneOpen(z){
  if(z.soon) return false; if(me.teacher) return true;
  const i = ZONES.indexOf(z); if(i===0) return true;
  const prev = ZONES[i-1]; return stars(prev.levels[prev.levels.length-1].id) >= 1;
}
const zoneStars = z => z.levels.reduce((s,l)=>s+stars(l.id),0);
const totalStars = () => ALL_LEVELS.reduce((s,l)=>s+stars(l.id),0);
function currentZone(){ const open = ZONES.filter(z=>zoneOpen(z)); return open.find(z=>z.levels.some(l=>stars(l.id)===0)) || open[open.length-1] || ZONES[0]; }
function nextLevelIn(z){ return z.levels.find(l=>stars(l.id)===0 && levelOpen(l)) || null; }
function medalLevel(sym){ return Math.min((me.medals[sym]||[]).length, 3); }
function learnedSyms(){ return MEDAL_SYMS.filter(([s,lid])=>stars(lid)>=1).map(([s])=>s); }
const reviewReady = () => learnedSyms().length>0 && me.reviewDay !== todayKey();

function showLogin(){

  inp.addEventListener('input', ()=>{ inp.value = inp.value.replace(/\D/g,'').slice(0,4); $('#login-err').textContent=''; });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  $('#btn-login').onclick = doLogin;
  setTimeout(()=>inp.focus(), 50);

async function doLogin(){
  const btn=$('#btn-login'); if(btn.disabled) return;
  const b = $('#badge').value.trim();
  if(!/^\d{4}$/.test(b)){ $('#login-err').textContent='胸牌號碼是四位數字，例如 5102。'; return; }
  if(b!=='0000' && !/^[1-6]\d{3}$/.test(b)){ $('#login-err').textContent='第一個數字是年級（1～6），再檢查一次胸牌喔。'; return; }
  badgeNow = b;
  if(b==='0000'){
    me = MEM.players[b] = MEM.players[b] || {name:'', avatar:{...DEFAULT_LOOK}, stars:{}, wrong:{}, medals:{}, reviewDay:null, created:Date.now(), teacher:true};
    me.name ? enterGame(true) : showCreator(true); return;
  }
  let cloudP=null, resetAt=0, offline=false;
  if(CLOUD.on){
    btn.disabled=true; $('#login-err').textContent=''; $('#login-note').textContent='正在讀取雲端進度…';
    try{ const r=await cloudLoad(b); if(r && r.ok){ cloudP=r.player||null; resetAt=Number(r.resetAt)||0; } else offline=true; }catch(e){ offline=true; }
    btn.disabled=false;
    $('#login-note').textContent = offline ? '連不上雲端，這次的進度會先存在這台電腦，連上網路後會自動上傳。' : '';
    if(offline) cloudStatus('⚠ 暫存在這台電腦，稍後再上傳');
  }
  let local=MEM.players[b];
  if(local && resetAt && (local.updated||local.created||0) < resetAt) local=null;
  const p=mergePlayers(local, cloudP);
  if(!p || !p.name){
    me = MEM.players[b] = {name:'', avatar:{...DEFAULT_LOOK}, stars:{}, wrong:{}, medals:{}, reviewDay:null, created:Date.now(), teacher:false};
    showCreator(true); return;
  }
  if(!p.avatar || typeof p.avatar.hair==='number') p.avatar={...DEFAULT_LOOK};
  confirmWho(b,p);
}
function confirmWho(b,p){
  const st=ALL_LEVELS.reduce((s,l)=>s+starsOf(p,l.id),0);
  $('#app').innerHTML = `<div class="page">

  });

  if(!isNew) $('#cr-cancel').onclick = ()=>{ clearInterval(creatorTimer); enterGame(false); };
  let fr=0; clearInterval(creatorTimer);

  paint(); creatorTimer = setInterval(paint, 380);

function renderOpts(){
  const looks = HAIRS.map(([k,l])=>`<button class="look" data-k="hair" data-v="${k}" aria-pressed="${draft.hair===k}"><canvas width="56" height="60" data-h="${k}"></canvas>${l}</button>`).join('');
  const sw = (title,key,cols,names) => `<div class="opt-group"><h3>${title}</h3><div class="opts">${cols.map((c,i)=>`<button class="sw" style="background:${c}" data-k="${key}" data-v="${i}" aria-pressed="${draft[key]===i}" aria-label="${names?names[i]:title+' '+(i+1)}"></button>`).join('')}</div></div>`;
  $('#cr-opts').innerHTML = `<div class="opt-group"><h3>髮型</h3><div class="opts">${looks}</div></div>`
    + sw('髮色','hairC',HAIRC.map(h=>h[0]),HAIRC.map(h=>h[1])) + sw('膚色','skin',SKINS) + sw('上衣','shirt',SHIRTS) + sw('褲子','pants',PANTS)
    + `<div class="opt-group"><h3>配件</h3><div class="opts">${ACCS.map(([k,l])=>`<button class="opt" data-k="acc" data-v="${k}" aria-pressed="${draft.acc===k}">${l}</button>`).join('')}</div></div>`;
  document.querySelectorAll('canvas[data-h]').forEach(cv=>{ const c=cv.getContext('2d'); c.imageSmoothingEnabled=false; drawPerson(c,4,58,3,{...draft,hair:cv.dataset.h},{noShadow:1}); });
}

const MAPS = {};
let M = null;
function newMap(id, name, W, H, base, solid, extra={}){
  const m = {id, name, W, H, TT:[], TP:[], TC:[], labels:[], warps:[], rooms:{}, hosts:[], chests:[], signs:[], hostIndex:new Map(), warpIndex:new Map(), off:null, offKey:'', ...extra};
  for(let y=0;y<H;y++){ m.TT.push(new Array(W).fill(solid?1:0)); m.TP.push(new Array(W).fill(base)); m.TC.push(new Array(W).fill(null)); }
  MAPS[id]=m; return m;
}
function mset(m,x,y,t,p,col){ if(x<0||y<0||x>=m.W||y>=m.H) return; m.TT[y][x]=t; m.TP[y][x]=p; if(col!==undefined) m.TC[y][x]=col; }
function mfill(m,x0,y0,x1,y1,t,p){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) mset(m,x,y,t,p); }
function addWarp(m,x,y,to,tx,ty,label,bld){ m.warps.push({x,y,to,tx,ty,label,bld}); }

/* ---- one wing of one floor ----
   local axes: u runs along the wing; v runs across it.
   v=0 outer wall on the corridor side, v=1-2 corridor, v=3 wall with doors, v=4..3+rh rooms, v=4+rh outer wall. */
function buildWing(m, tf, units, rh, opt){
  const V = 4+rh; let len = 1; units.forEach(u=>len += u.w+1);
  const S = (u,v,t,p) => { const [x,y]=tf(u,v); mset(m,x,y,t,p,opt.col); };
  for(let u=0;u<len;u++) for(let v=0;v<=V;v++){
    const edge = u===0 || u===len-1 || v===0 || v===V || v===3;
    if(edge) S(u,v,1,(v===0||v===V) && u>0 && u<len-1 && u%2===0 ? 'wallW' : 'wall');
    else if(v<=2) S(u,v,0,'hall'); else S(u,v,1,'wall');
  }
  if(opt.openStart) for(const v of [1,2]) S(0,v,0,'hall');
  let a = 1;
  for(const un of units){
    for(let u=a;u<a+un.w;u++) for(let v=4;v<=3+rh;v++) S(u,v,0, un.kind==='toilet'?'tilefloor' : un.kind==='passage'?'hall' : un.kind==='hall'?'hallfloor' : 'floor');
    furnish(S, un, a, rh, V);
    const c1=tf(a,4), c2=tf(a+un.w-1,3+rh);
    const r = {...un, u0:a, u1:a+un.w-1, tf, rh, V, bld:opt.bld, map:m.id,
      x0:Math.min(c1[0],c2[0]), x1:Math.max(c1[0],c2[0]), y0:Math.min(c1[1],c2[1]), y1:Math.max(c1[1],c2[1]), door:tf(a+1,4)};
    if(un.kind==='stairs') r.landing = tf(a+1,5);
    if(un.kind==='passage'){ r.near=[]; r.far=[]; for(let u=a;u<a+un.w;u++){ r.near.push(tf(u,0)); r.far.push(tf(u,V)); } }
    if(un.label && un.kind!=='blank' && un.kind!=='stairs') m.labels.push([un.label,(r.x0+r.x1+1)/2,r.y0+.55,.52]);
    if(un.kind==='stairs') m.labels.push(['樓梯',(r.x0+r.x1+1)/2,r.y0+.55,.45]);
    m.rooms[un.id] = r;
    a += un.w+1;
  }
  return {len, V};
}
function furnish(S, un, a, rh, V){
  const w=un.w, k=un.kind, vE=3+rh, mid=a+Math.floor((w-1)/2);
  const put=(u,v,p)=>S(u,v,1,p);
  if(k==='blank'){ for(let u=a;u<a+w;u++) for(let v=4;v<=vE;v++) put(u,v,'wall'); return; }
  if(k==='void'){ for(let u=a;u<a+w;u++){ put(u,3,'rail'); for(let v=4;v<=vE;v++) put(u,v,'void'); } return; }
  if(k==='stairs'){
    for(let u=a;u<a+w;u++) S(u,3,0,'hall');
    for(let v=4;v<=vE;v++){
      S(a+1,v,0,'landing');
      if(v===4){ S(a,v,0,'landing'); S(a+2,v,0,'landing'); continue; }
      un.up ? S(a,v,0,'stUp') : put(a,v,'rail');
      un.down ? S(a+2,v,0,'stDn') : put(a+2,v,'rail');
    }
    return;
  }
  if(k==='passage'){
    for(let u=a;u<a+w;u++){ S(u,3,0,'hall'); if(un.near) S(u,0,0,'exit'); if(un.far) S(u,V,0,'exit'); }
    for(let v=4;v<=vE;v++){ S(a-1,v,1,'bboard'); S(a+w,v,1,'bboard'); }
    return;
  }
  // ordinary room: one door (two for wide rooms)
  S(a+Math.min(1,w-1),3,0,'doorway'); if(w>=10) S(a+w-2,3,0,'doorway');
  const row = (v,p,skip=[]) => { for(let u=a;u<a+w;u+=2) if(!skip.includes(u)) put(u,v,p); };
  switch(k){
    case 'class': row(5,'desk'); if(rh>=5) row(7,'desk'); put(mid,vE,'tdesk'); for(let u=a+1;u<a+w-1;u++) S(u,V,1,'board'); break;
    case 'office': row(5,'pcdesk'); put(a,vE,'cabinet'); put(a+w-1,vE,'cabinet'); if(w>=8) row(vE,'pcdesk',[a,a+w-1]); break;
    case 'principal': put(mid,6,'bigdesk'); put(mid+1,6,'bigdesk'); put(a,vE,'sofa'); put(a+1,vE,'sofa'); put(a+w-1,4,'plant'); put(a+w-1,vE,'cabinet'); break;
    case 'toilet': for(let u=a;u<a+w;u++) put(u,vE,'stall'); put(a+w-1,4,'sink'); if(w>=4) put(a+w-1,5,'sink'); break;
    case 'library': for(let u=a;u<a+w;u++){ if((u-a)%4!==3) put(u,vE,'shelf'); } for(let u=a+1;u<a+w-1;u+=3) put(u,5,'rtable'); break;
    case 'music': put(a+w-1,vE,'piano'); if(w>=4) put(a+w-2,vE,'piano'); row(5,'chair'); break;
    case 'av': for(let u=a+1;u<a+w-1;u++) S(u,V,1,'screen'); row(5,'chair'); row(vE-1,'chair'); break;
    case 'hall': for(let u=a;u<a+w;u++) put(u,vE,'stage'); put(a+2,5,'hoop'); put(a+w-3,5,'hoop'); break;
    case 'pc': for(let u=a;u<a+w-1;u++){ put(u,5,'pcdesk'); put(u,vE,'pcdesk'); } put(a+w-1,vE,'tdesk'); break;
    case 'lab': for(let u=a+1;u<a+w-1;u++) put(u,5,'bench'); put(a,vE,'shelf'); put(a+w-1,vE,'sink'); break;
    case 'nurse': for(let u=a;u<a+w;u+=2) put(u,vE,'bed'); put(a+w-1,4,'cabinet'); break;
    case 'lounge': put(a,vE,'sofa'); put(a+1,vE,'sofa'); put(mid,5,'ctable'); put(a+w-1,4,'plant'); break;
    case 'gym': put(a,vE,'balls'); put(a+w-1,vE,'balls'); put(a,5,'cones'); put(a+w-1,6,'mat'); break;
    case 'archive': for(let u=a;u<a+w;u+=2){ put(u,5,'shelf'); put(u,vE,'shelf'); } break;
    case 'kinder': put(a,5,'toy'); put(a+2,7,'toy'); put(mid,vE,'tdesk'); break;
  }
}

  while(q.length){ const [x,y]=q.shift(); for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+a, ny=y+b, k=ny*m.W+nx; if(nx<r.x0||nx>r.x1||ny<r.y0||ny>r.y1||ok.has(k)||m.TT[ny][nx]!==0||m.hostIndex.has(k)) continue; ok.add(k); q.push([nx,ny]); } }

function camUpdate(snap){
  const T=G.T, tx=(G.p.x+.5)*T-G.cw/2, ty=(G.p.y+.5)*T-G.ch*.42;
  const mx=Math.max(0,M.W*T-G.cw), my=Math.max(0,M.H*T-G.ch);
  const cx = M.W*T<G.cw ? -(G.cw-M.W*T)/2 : Math.min(mx,Math.max(0,tx));
  const cy = M.H*T<G.ch ? -(G.ch-M.H*T)/2 : Math.min(my,Math.max(0,ty));

function npcTick(n,dt){
  if(!n.path.length){ n.t-=dt; if(n.t<=0){ n.t=2+Math.random()*4;
      const gx=n.home[0]+Math.round((Math.random()-.5)*10), gy=n.home[1]+Math.round((Math.random()-.5)*6);
      if(walkable(gx,gy) && !warpAt(M,gx,gy)){ const p=bfs(Math.round(n.x),Math.round(n.y),[[gx,gy]]); if(p && p.length<14) n.path=p; } }

/* 田徑隊: runners lapping the track and a long jumper */
const RUN_LOOKS = [P('short','#2b2320','#f2a03d','#22303a'),P('pony','#2b2320','#f2a03d','#22303a'),P('spiky','#6b4428','#f2a03d','#22303a','none','#cf966a'),P('bob','#2b2320','#f2a03d','#22303a','none','#ebbd96')];

function ovalPos(s){
  const tx=6.5, ty=4, tw=39.5, th=15.5, r=th/2, L=tw-2*r, P_=2*L+2*Math.PI*r; s=((s%P_)+P_)%P_;

  s-=L; if(s<Math.PI*r){ const a=-Math.PI/2-s/r; return [tx+r+Math.cos(a)*r, ty+r+Math.sin(a)*r]; }
  s-=Math.PI*r; if(s<L) return [tx+r+s, ty+th];
  s-=L; const a=Math.PI/2-s/r; return [tx+tw-r+Math.cos(a)*r, ty+r+Math.sin(a)*r];
}
function jumperPos(t){
  const p=t%8;
  if(p<2.6) return {x:7.5, y:8.5+(p/2.6)*14.3, dir:1, run:1};
  if(p<3.2){ const k=(p-2.6)/.6; return {x:7.5, y:22.8+k*2.8, hop:Math.sin(k*Math.PI)*1.1, dir:1}; }
  if(p<4.4) return {x:7.5, y:25.6, dir:1, mood:'ok'};

/* the football and the basketball */
const HOOPS = [[55.5,4.15],[55.5,18.85]];
function newBall(kind){ const [x,y] = kind==='bb' ? [55.5+OX,11.5+OY] : [27+OX,12.5+OY]; return {kind,x,y,vx:0,vy:0,spin:0,reset:0}; }
function ballReset(){ G.balls=[newBall('fb'),newBall('bb')]; }
function ballSolid(x,y){ const tx=Math.floor(x), ty=Math.floor(y); if(tx<0||ty<0||tx>=CAMPUS.W||ty>=CAMPUS.H) return true; return CAMPUS.TT[ty][tx]===1 || CAMPUS.hostIndex.has(ty*CAMPUS.W+tx); }
function ballTick(b,dt){
  if(b.reset>0){ b.reset-=dt; if(b.reset<=0) Object.assign(b,newBall(b.kind)); return; }
  const px=G.p.x+.5, py=G.p.y+.5, dx=b.x-px, dy=b.y-py, d=Math.hypot(dx,dy);
  if(d<.75 && G.path.length>0){
    const [nx,ny]=G.path[0], mx=nx-G.p.x, my=ny-G.p.y, ml=Math.hypot(mx,my)||1;
    let ux=dx/(d||1)*.5+mx/ml*.8, uy=dy/(d||1)*.5+my/ml*.8; const ul=Math.hypot(ux,uy)||1;
    const sp = b.kind==='bb' ? (G.dash?9:6.5) : (G.dash?12:8); b.vx=ux/ul*sp; b.vy=uy/ul*sp;
  }
  const r=.22;
  let nx=b.x+b.vx*dt; if(ballSolid(nx+Math.sign(b.vx)*r,b.y)){ b.vx=-b.vx*.6; nx=b.x; } b.x=nx;
  let ny=b.y+b.vy*dt; if(ballSolid(b.x,ny+Math.sign(b.vy)*r)){ b.vy=-b.vy*.6; ny=b.y; } b.y=ny;
  const fr=Math.max(0,1-(b.kind==='bb'?2.2:1.7)*dt); b.vx*=fr; b.vy*=fr; b.spin+=Math.hypot(b.vx,b.vy)*dt;
  if(b.kind==='fb'){
    const tp=CAMPUS.TP[Math.floor(b.y)]?.[Math.floor(b.x)];
    if(tp==='goalL'||tp==='goalR'){ G.goals++; if(me && !me.teacher){ me.goalsTotal=(me.goalsTotal||0)+1; save(); } b.vx=b.vy=0; b.reset=1.3; toast(`⚽ 進球！這節已經踢進 ${G.goals} 球`); cheer(true); }
  } else {
    for(const [hx,hy] of HOOPS) if(Math.hypot(b.x-(hx+OX),b.y-(hy+OY))<.6){ G.baskets=(G.baskets||0)+1; if(me && !me.teacher){ me.basketsTotal=(me.basketsTotal||0)+1; save(); } b.vx=b.vy=0; b.reset=1.2; toast(`🏀 投進了！這節已經投進 ${G.baskets} 球`); cheer(true); break; }
  }
}

function frame(ts){
  G.raf = requestAnimationFrame(frame);
  if($('#rpg').hidden || !M) return;
  const dt = Math.min(.05,(ts-(G.last||ts))/1000); G.last=ts;
  if(G.state==='walk' && !G.path.length && G.keyDir){
    const [dx,dy]=G.keyDir, nx=Math.round(G.p.x)+dx, ny=Math.round(G.p.y)+dy;
    if(dx) G.dir=dx>0?1:-1;
    if(walkable(nx,ny)) G.path=[[nx,ny]];
  }
  if(G.path.length && G.state==='walk'){
    const [nx,ny]=G.path[0], sp=(G.dash?9.5:5.4)*dt, dx=nx-G.p.x, dy=ny-G.p.y, d=Math.hypot(dx,dy);
    if(dx) G.dir=dx>0?1:-1;
    if(d<=sp){ G.p.x=nx; G.p.y=ny; G.path.shift(); const w=warpAt(M,nx,ny); if(w) doWarp(w); else if(!G.path.length) arrived(); }
    else { G.p.x+=dx/d*sp; G.p.y+=dy/d*sp; }
    G.step+=dt*(G.dash?14:8);
  }
  if(M===CAMPUS){ G.npcs.forEach(n=>npcTick(n,dt)); (G.balls||[]).forEach(b=>ballTick(b,dt)); }
  if(G.fade>0) G.fade=Math.max(0,G.fade-dt*3.5);
  camUpdate(false); draw(ts/1000);
}
function doWarp(w){
  if(w.elev){ G.path=[]; G.keyDir=null; return openElevator(); }
  M=MAPS[w.to]; G.p={x:w.tx,y:w.ty}; G.path=[]; G.talk=null; G.keyDir=null; G.justWarped=true; G.fade=1;
  resize(); camUpdate(true); renderHud(); toast(M.name);
}
function pill(c,text,cx,cy,bg,fg,size){

function guide(){
  const tg=nextTarget(); if(!tg) return null;
  const h=HOST[tg.id];
  if(h.map===M.id) return {x:h.x, y:h.y-(tg.t==='boss'?.35:0), label:`${h.name}：${tg.name}`};
  const nxt=routeNext(M.id,h.map); if(!nxt) return null;
  let best=null, bd=1e9; const px=Math.round(G.p.x), py=Math.round(G.p.y);
  for(const w of M.warps) if(w.to===nxt){ const d=Math.abs(w.x-px)+Math.abs(w.y-py); if(d<bd){ bd=d; best=w; } }
  return best ? {x:best.x, y:best.y, label:best.label} : null;
}

  }});

function onTap(e){
  if(G.state!=='walk') return;
  const r=G.cv.getBoundingClientRect(), x=e.clientX-r.left+G.cam.x, y=e.clientY-r.top+G.cam.y;
  const tx=Math.floor(x/G.T), ty=Math.floor(y/G.T); if(tx<0||ty<0||tx>=M.W||ty>=M.H) return;
  const sx=Math.round(G.p.x), sy=Math.round(G.p.y);
  G.talk=null;
  const host = hostAt(M,tx,ty) || (ty+1<M.H ? hostAt(M,tx,ty+1) : null);
  if(host){ const h=HOST[host]; G.talk=host;
    if(Math.abs(sx-h.x)+Math.abs(sy-h.y)===1){ G.path=[]; return talkTo(host); }
    goPath(sx,sy,neighbors(h.x,h.y)); return; }
  if(M===CAMPUS && M.TP[ty][tx]==='board'){ goPath(sx,sy,[BOARD.stand]); return; }
  if(M===CAMPUS && BLD_NAME[M.TP[ty][tx]]){
    const doors=M.warps.filter(w=>w.bld===M.TP[ty][tx]).sort((a,b)=>(Math.abs(a.x-tx)+Math.abs(a.y-ty))-(Math.abs(b.x-tx)+Math.abs(b.y-ty)));
    if(doors.length){ goPath(sx,sy,[[doors[0].x,doors[0].y]]); return; }
  }
  if(walkable(tx,ty)) goPath(sx,sy,[[tx,ty]]); else { const nb=neighbors(tx,ty); if(nb.length) goPath(sx,sy,nb); }
}
function goPath(sx,sy,goals){
  G.p.x=Math.round(G.p.x); G.p.y=Math.round(G.p.y);
  const p=bfs(sx,sy,goals); if(p===null) return;
  G.path=p; if(!p.length) arrived();
}
function arrived(){

  const ch = chestAt(M,px,py); if(ch && !(me.treasures||[]).includes(ch.id)) return openChest(ch);

}
const KEYMAP = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
window.addEventListener('keydown', e=>{

function pkPool(){

function openPK(){
  const cap=HOST['team-cap'];
  openSheet(`<div class="talk"><canvas id="pt" width="96" height="104"></canvas>
      <div><div class="kicker">操場・東芳足球隊</div><h2>PK 大賽</h2><p class="say">「每一球會出現一個題目，在守門員撲過來之前打出來，按 Enter 射門！一共 ${PK_SHOTS} 球。」</p></div></div>

  portrait('pt', cap.look, 5);

function pkStart(){
  const pool=pkPool(), syms=pool.filter(p=>!p.en&&!p.zh), words=shuffle(pool.filter(p=>p.en||p.zh));
  const items=shuffle(syms).slice(0,3); while(items.length<PK_SHOTS) items.push(words.pop());
  pk.items=shuffle(items); pk.round=0; pk.goals=0; $('#pk-start').hidden=true; $('#pk-fb').textContent=''; pkNext();
}
function pkNext(){
  if(pk.round>=PK_SHOTS) return pkEnd();
  pk.item=pk.items[pk.round]; pk.phase='aim'; pk.t0=performance.now(); pk.limit=Math.max(3.5, pk.item.t - pk.round*.5); pk.side=Math.random()<.5?-1:1;

  const inp=$('#pk-in'); inp.disabled=false; inp.value=''; $('#pk-shoot').disabled=false; setTimeout(()=>inp.focus(),20);
}
function pkShoot(timeout){
  if(!pk || pk.phase!=='aim') return;
  const got=$('#pk-in').value, ok = timeout!==true && norm(got)===norm(pk.item.ans);

  const fb=$('#pk-fb');
  if(ok){ fb.className='feedback ok'; fb.textContent='⚽ 進球！'; cheer(true); }
  else {
    let why = timeout===true ? '時間到，守門員撲到了！' : '被守門員撲出來了！';
    const half=[...norm(got)].find(ch=>HALF[ch]); if(half && !pk.item.en) why+=' '+halfMsg(half);

  }

  setTimeout(()=>{ if(!pk) return; pk.round++; pkNext(); }, 1500);
}
function pkEnd(){
  pk.phase='end';

function pkLoop(now){
  const cv=document.getElementById('pk-cv'); if(!cv || !pk) return;
  requestAnimationFrame(pkLoop);
  const c=cv.getContext('2d'), Wd=cv.width, Hd=cv.height; c.imageSmoothingEnabled=false;
  c.fillStyle='#4caf50'; c.fillRect(0,0,Wd,Hd); c.fillStyle='#56b85a'; for(let i=0;i<6;i++) if(i%2) c.fillRect(i*60,0,60,Hd);
  c.strokeStyle='rgba(255,255,255,.8)'; c.lineWidth=2; c.strokeRect(40,120,280,60);
  // goal
  c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=1; for(let x=70;x<=290;x+=14){ c.beginPath(); c.moveTo(x,24); c.lineTo(x,118); c.stroke(); } for(let y=24;y<=118;y+=14){ c.beginPath(); c.moveTo(66,y); c.lineTo(294,y); c.stroke(); }
  c.fillStyle='#fff'; c.fillRect(62,20,236,6); c.fillRect(62,20,6,100); c.fillRect(292,20,6,100);
  // timer
  let frac=1;
  if(pk.phase==='aim'){ frac=Math.max(0,1-(now-pk.t0)/1000/pk.limit); if(frac<=0) pkShoot(true); }
  if(pk.phase!=='aim') frac = pk.phase==='idle'||pk.phase==='end' ? 1 : 0;
  const bar=$('#pk-bar'); if(bar) bar.style.width=(frac*100)+'%';
  // keeper
  const keeperLook={...HOST['team-5'].look, shirt:'#3fa34e', pants:'#22303a', acc:'none'};
  let kx=180+Math.sin(now/260)*12*(pk.phase==='aim'?1:.3), ky=118, ballX=180, ballY=150, ballR=9;
  if(pk.phase==='aim'){ kx += pk.side*(1-frac)*60; }
  if(pk.phase==='result'){
    const p=Math.min(1,(now-pk.anim)/450), target=pk.side*-1;
    if(pk.result==='goal'){ ballX=180+target*95*p; ballY=150-95*p; kx=180+pk.side*80*p; }
    else { ballX=180+pk.side*80*p; ballY=150-70*p; kx=180+pk.side*80*p; }
    ballR=9-3*p;
  }
  c.save(); c.translate(kx,0); if(pk.phase==='result') { c.translate(0,ky-24); c.rotate(pk.side*Math.min(1,(now-pk.anim)/300)*0.9); c.translate(0,-(ky-24)); }
  drawPerson(c,-24,ky,3,keeperLook,{noShadow:1,mood:pk.phase==='result'&&pk.result==='save'?'ok':'idle'}); c.restore();
  c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(ballX,ballY+ballR,ballR,ballR*.35,0,0,7); c.fill();
  c.fillStyle='#fff'; c.strokeStyle='#22303a'; c.lineWidth=1.5; c.beginPath(); c.arc(ballX,ballY,ballR,0,7); c.fill(); c.stroke();
  c.fillStyle='#22303a'; c.beginPath(); c.arc(ballX,ballY,ballR*.35,0,7); c.fill();
  if(pk.phase==='result' && pk.result==='goal' && now-pk.anim>450){ c.fillStyle='#ffd84a'; c.strokeStyle='#22303a'; c.lineWidth=4; c.font='900 34px sans-serif'; c.textAlign='center'; c.strokeText('GOAL!',180,80); c.fillText('GOAL!',180,80); }
}

    MG.draw(c,st); const s=$('#mg-stat'); if(s) s.textContent=MG.status(st);

      st.rewarded=true; grantChest(ch); mgSound(880,.2);

  };
  requestAnimationFrame(loop);
}

/* ============ checking ============ */
function norm(s){ return String(s).replace(/[\s　]/g,'').replace(/[０-９Ａ-Ｚａ-ｚ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)); }
const BOPO = /[ㄅ-ㄯˇˊˋ˙]/;
const nameOf = c => SYMNAME[c] ? `「${c}」${SYMNAME[c]}` : `「${c}」`;
function halfMsg(ch){
  const full = HALF[ch]; if(!full) return null;
  if(SHIFT_FAM.includes(full)) return `你打出英文的「${ch}」了，不是中文的「${full}」。可能是只按了一下 Shift 就放開，結果切成英文模式。先按一下 Shift 切回「中」，再按住 Shift 不放，按 ${COMBO[full].label[1]}。`;
  return `你打出英文的「${ch}」了，不是中文的「${full}」。看看右下角是不是「中」，再按住 Ctrl 按 ${COMBO[full].label[1]}。`;
}
function checkType(item, got){
  const E = norm(item.ans), G = norm(got);
  if(E===G) return {ok:true};
  if(!G) return {ok:false, msg:'還沒有打字喔！'};
  const eLat = /[A-Za-z0-9]/.test(E), gLetters = /[A-Za-z]/.test(G), eLetters = /[A-Za-z]/.test(E);
  if(BOPO.test(G) && !BOPO.test(E)) return {ok:false, msg: eLat ? '跑出注音了！打英文之前，先按一下 Shift 切到英文模式。' : '還有注音沒變成國字，記得按空白鍵或選字。'};
  for(const ch of G){ if(HALF[ch] && !E.includes(ch)) return {ok:false, msg:halfMsg(ch)}; }
  if(gLetters && !eLetters) return {ok:false, msg:'出現英文字母了，你現在是英文模式。按一下 Shift 切回中文。'};
  if(eLetters && !gLetters && !BOPO.test(G)) return {ok:false, msg:'英文的部分沒打出來，記得在中英之間按 Shift 切換。'};
  let i=0; while(i<E.length && i<G.length && E[i]===G[i]) i++;
  const a = E[i], b = G[i];
  const idx = displayIndex(item.text, i);
  if(a===undefined) return {ok:false, msg:`後面多打了「${G.slice(i)}」，把多的刪掉。`, idx:-1};
  if(b===undefined) return {ok:false, msg: PUNCT.includes(a) ? `最後少了${nameOf(a)}。` : `還沒打完喔，少了「${E.slice(i)}」。`, idx};
  if(PUNCT.includes(a) && PUNCT.includes(b)) return {ok:false, msg:`這裡應該是${nameOf(a)}，你打成${nameOf(b)}了。`, idx};
  if(PUNCT.includes(a)) return {ok:false, msg:`這裡少了${nameOf(a)}。`, idx};
  if(PUNCT.includes(b)) return {ok:false, msg:`這裡多了一個${nameOf(b)}。`, idx};
  return {ok:false, msg:`第 ${i+1} 個字不一樣：應該是「${a}」，你打成「${b}」。${/[一-鿿]/.test(a)?'可能是選錯字了。':''}`, idx};
}
function displayIndex(text, normIdx){ let n=0; const chars=[...text]; for(let k=0;k<chars.length;k++){ if(/[\s　]/.test(chars[k])) continue; if(n===normIdx) return k; n++; } return -1; }
function checkFill(item, got){
  const G = [...norm(got)], B = item.blanks;
  const ok = G.length===B.length && G.every((c,k)=>B[k].includes(c));
  if(ok) return {ok:true};
  if(!G.length) return {ok:false, msg:'還沒有打字喔！只要打出空格裡的符號就好。'};
  for(const ch of G){ if(HALF[ch]) return {ok:false, msg:halfMsg(ch), wrongBlank:-1}; }
  if(G.some(c=>!PUNCT.includes(c))) return {ok:false, msg:'這關只要打出空格裡的「標點符號」，不用打字。'};
  if(G.length!==B.length) return {ok:false, msg:`這句有 ${B.length} 個空格，你打了 ${G.length} 個符號。`};
  const k = G.findIndex((c,j)=>!B[j].includes(c));
  return {ok:false, msg:`第 ${k+1} 格放${nameOf(G[k])}不對喔。`, wrongBlank:k};
}
function itemSyms(it){
  if(it.k==='fill') return it.blanks.map(b=>b[0]);
  if(it.k==='type') return [...it.ans].filter(c=>PUNCT.includes(c));
  return [];
}
function countWrong(it, got){
  const G = norm(got);
  if(it.k==='fill'){ const g=[...G]; it.blanks.forEach((b,k)=>{ if(!b.includes(g[k])) bump(b[0]); }); return; }
  if(it.k==='type'){ const E = norm(it.ans); for(const s of new Set([...E].filter(c=>PUNCT.includes(c)))){ const ce=[...E].filter(c=>c===s).length, cg=[...G].filter(c=>c===s).length; if(ce!==cg) bump(s); } }
}
function bump(s){ me.wrong[s] = (me.wrong[s]||0) + 1; }
function ease(it){ for(const s of new Set(itemSyms(it))) me.wrong[s] = Math.max(0,(me.wrong[s]||0)-0.5); }
function wpick(pool, n){
  const w = it => 1 + itemSyms(it).reduce((s,c)=>s+(me.wrong[c]||0),0);
  let copy = pool.map(it=>({it, w:w(it)})), out=[];
  while(out.length<n && copy.length){
    const tot = copy.reduce((s,a)=>s+a.w,0); let r = Math.random()*tot, j=0;
    for(; j<copy.length; j++){ r -= copy[j].w; if(r<=0) break; }
    j = Math.min(j, copy.length-1); out.push(copy[j].it); copy.splice(j,1);
  }
  return out;
}

/* ============ play ============ */
let run = null;
function playShell(titleHTML){
  return `<div class="play-head"><button class="px-btn small" id="play-quit">← 離開</button><h2 id="play-title">${titleHTML}</h2><div class="dots" id="play-dots"></div></div>
   <div class="card">
     <div class="ask" id="q-ask"></div>
     <div id="q-tray"></div>
     <div class="target" id="q-target"></div>
     <div class="choices" id="q-choices" hidden></div>
     <div class="answer-row" id="q-answer"><input id="q-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="在這裡打字"><button class="px-btn go" id="q-submit">送出</button></div>
     <div class="feedback" id="q-fb" role="status"></div>
     <div class="actions"><button class="px-btn small" id="q-hint">看提示（這關最多 2 顆星）</button><button class="px-btn go" id="q-next" hidden>繼續 →</button><span class="muted" id="q-note" style="font-size:15px"></span></div>
   </div>
   <div class="hint-box" id="hint-box" hidden></div>`;
}
function bindPlay(){
  $('#play-quit').onclick = ()=>{ run=null; closeSheet(); };
  $('#q-hint').onclick = ()=>{ const it=run.queue[0]; if(!it) return; run.hintUsed=true; showHint(it); $('#q-hint').hidden=true; };
  $('#q-submit').onclick = submit;
  $('#q-input').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing && e.keyCode!==229){ e.preventDefault(); if(!$('#q-next').hidden) advance(); else submit(); } });
  $('#q-next').onclick = advance;
}
function startLevel(lv){
  let items = lv.items ? lv.items.map(x=>({...x})) : lv.gen ? lv.gen() : wpick(lv.pool, lv.n);
  items = items.map((it,i)=>({...it, uid:i}));
  run = {lv, items, queue:[...items], score:{}, hintUsed:false, wrongTries:0, requeued:new Set(), review:false, locked:false};
  openSheet(playShell(`<span class="tag t-${lv.t}">${TYPE_LABEL[lv.t]}</span> ${esc(lv.name)}`)); bindPlay(); nextItem();
}
function startReview(){
  const L=learnedSyms(); if(!L.length) return;
  const counts = me.reviewDay !== todayKey();
  if(counts){ me.reviewDay = todayKey(); save(); }
  const pool = L.map(s=>({k:'type', ask:'憑記憶打出這個符號（沒有提示喔）', show: s==='（）'?'一組括號（左右都要）':SYMNAME[s], text:s, ans:s, sym:s,
    w: 1 + (me.wrong[s==='（）'?'（':s]||0) + (3-medalLevel(s))*.6 }));
  const picked=[], copy=[...pool], n=Math.min(5,Math.max(3,L.length));
  while(picked.length<n){
    if(!copy.length) copy.push(...pool);
    const tot=copy.reduce((s,a)=>s+a.w,0); let r=Math.random()*tot, j=0;
    for(;j<copy.length;j++){ r-=copy[j].w; if(r<=0) break; } j=Math.min(j,copy.length-1);
    picked.push({...copy[j]}); copy.splice(j,1);
  }
  const items = picked.map((it,i)=>({...it, uid:i}));
  run = {lv:{t:'boss', name:'今日複習挑戰', id:'review'}, items, queue:[...items], score:{}, hintUsed:false, wrongTries:0, requeued:new Set(), review:true, counts, locked:false};
  openSheet(playShell(`<span class="tag t-boss">複習</span> 今日複習挑戰${counts?'':'（不計分）'}`)); bindPlay(); nextItem();
}
function renderDots(){
  const cur=run.queue[0];
  $('#play-dots').innerHTML = run.items.map(it=>{ const s=run.score[it.uid]; const cls=s===true?'ok':s===false?'bad':(cur&&cur.uid===it.uid?'now':''); return `<span class="dot ${cls}"></span>`; }).join('');
}
function renderTarget(it, badIdx){
  if(it.show) return `<span class="show-name">${esc(it.show)}</span>`;
  if(it.k==='fill'){ let k=0; return [...it.text].map(c=> c==='＿' ? `<span class="blank" data-b="${k++}">&nbsp;</span>` : esc(c)).join(''); }
  return [...it.text].map((c,i)=> i===badIdx ? `<span class="bad-ch">${esc(c)}</span>` : esc(c)).join('');
}
function nextItem(){
  const it=run.queue[0]; if(!it) return finish();
  run.wrongTries=0; run.locked=false;
  renderDots();
  $('#q-ask').textContent = it.ask;
  $('#q-tray').innerHTML = it.tray ? `<div class="tray" aria-label="工作列的輸入法圖示是 ${it.tray}"><span>⌃</span><span class="ime">${it.tray}</span><span>上午 10:10</span></div>` : '';
  $('#q-target').innerHTML = it.k==='choice' ? esc(it.text) : renderTarget(it);
  $('#q-fb').textContent=''; $('#q-fb').className='feedback';
  $('#q-next').hidden=true; $('#q-note').textContent='';
  const isChoice = it.k==='choice';
  $('#q-choices').hidden=!isChoice; $('#q-answer').hidden=isChoice;
  if(isChoice){
    $('#q-choices').innerHTML = it.opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(o)}</button>`).join('');
    $('#q-choices').querySelectorAll('.choice').forEach(b=>b.onclick=()=>pickChoice(+b.dataset.i));
  } else {
    const inp=$('#q-input'); inp.value=''; inp.disabled=false;
    inp.placeholder = it.k==='fill' ? '只打空格裡的符號' : '在這裡打字';
    setTimeout(()=>inp.focus(),30);
  }
  const lv=run.lv;
  $('#q-hint').hidden = run.review || lv.t==='boss' || lv.t==='teach' || isChoice;
  if(lv.t==='teach' && !isChoice) showHint(it); else $('#hint-box').hidden=true;
}
function showHint(it){
  const syms=[...new Set(itemSyms(it))], list=[];
  if(run.lv.mode || (it.k==='type' && /[A-Za-z0-9]/.test(it.ans) && /[一-鿿]/.test(it.ans))) list.push('mode');
  list.push(...syms); if(!list.length) list.push('mode');
  const keys=new Set(list.flatMap(s=>COMBO[s].keys));
  const combos=list.map(s=>{ const c=COMBO[s];
    return `<div class="combo">${s==='mode'?'<span class="sym" style="font-size:17px">中⇄英</span>':`<span class="sym">${s}</span>`}${c.label.map(l=>`<span class="kc">${esc(l)}</span>`).join(' + ')}<span class="note">${esc(c.note)}</span></div>`; }).join('');
  const kb=`<div class="kb-scroll"><div class="kb">${KB.map(row=>`<div class="kb-row">${row.map(([id,main,sh,zy,w])=>`<div class="key${keys.has(id)?' on':''}${(w||1)>1?' wide':''}" style="--w:${w||1}"><span class="k-shift">${esc(sh)}</span><span class="k-main">${esc(main)}</span><span class="k-zy">${zy}</span></div>`).join('')}</div>`).join('')}</div></div>`;
  $('#hint-box').innerHTML=`<h3>按鍵提示</h3><div class="combos">${combos}</div>${kb}`; $('#hint-box').hidden=false;
}
function mark(it,ok){ if(!(it.uid in run.score)){ run.score[it.uid]=ok; if(ok) ease(it); } }
function cheer(ok){ G.mood=ok?'ok':'bad'; G.moodT=performance.now()/1000+2; }
function submit(){
  if(!run || run.locked) return;
  const it=run.queue[0]; if(!it || it.k==='choice') return;
  const got=$('#q-input').value;
  const r = it.k==='fill' ? checkFill(it,got) : checkType(it,got);
  const fb=$('#q-fb');
  if(r.ok){
    mark(it,true); cheer(true);
    if(it.k==='fill') $('#q-target').querySelectorAll('.blank').forEach((b,k)=>{ b.textContent=[...norm(got)][k]; });
    fb.className='feedback ok'; fb.textContent=['答對了！','漂亮！','沒錯！','太棒了！'][Math.floor(Math.random()*4)];
    run.locked=true; $('#q-input').disabled=true; renderDots();
    setTimeout(()=>{ if(!run) return; run.queue.shift(); nextItem(); },850);
    return;
  }
  const first=!(it.uid in run.score);
  mark(it,false); if(first) countWrong(it,got); save(); cheer(false);
  run.wrongTries++;
  fb.className='feedback no'; fb.textContent=r.msg;
  if(it.k==='type' && r.idx>=0 && !it.show) $('#q-target').innerHTML=renderTarget(it,r.idx);
  renderDots();
  const lv=run.lv;
  if(lv.t==='boss'){
    const ans = it.k==='fill' ? it.blanks.map(b=>b[0]).join(' ') : it.ans;
    fb.textContent = r.msg + `　正確答案：${ans}`;
    if(!run.requeued.has(it.uid)){ run.requeued.add(it.uid); $('#q-note').textContent='這題等一下會再出現一次。'; }
    run.locked=true; $('#q-input').disabled=true; $('#q-next').hidden=false; $('#q-next').focus();
    return;
  }
  if(lv.t==='teach'){ if(run.wrongTries>=2) $('#q-note').textContent='看看下面的鍵盤，亮起來的鍵要一起按。'; return; }
  if(it.k==='fill' && run.wrongTries>=2){ $('#q-target').querySelectorAll('.blank').forEach((b,k)=>{ b.textContent=it.blanks[k][0]; }); $('#q-note').textContent='答案在空格裡了，照著打一次就能繼續。'; }
  else $('#q-note').textContent = it.k==='fill' ? '再試一次。' : '修正後再按一次送出。';
}
function advance(){
  const it=run.queue.shift();
  if(run.lv.t==='boss' && it && run.score[it.uid]===false && run.requeued.has(it.uid) && !it._again) run.queue.push({...it,_again:true});
  nextItem();
}
function pickChoice(i){
  if(run.locked) return;
  const it=run.queue[0], ok=i===it.ans;
  mark(it,ok); renderDots(); cheer(ok);
  $('#q-choices').querySelectorAll('.choice').forEach((b,k)=>{ b.disabled=true; if(k===it.ans) b.classList.add('right'); else if(k===i) b.classList.add('wrong'); });
  const fb=$('#q-fb'); fb.className='feedback '+(ok?'ok':'no'); fb.textContent=(ok?'答對了！':'不對喔。')+it.why;
  run.locked=true; $('#q-next').hidden=false; $('#q-next').focus();
}
function finish(){
  const total=run.items.length, right=run.items.filter(it=>run.score[it.uid]===true).length, acc=right/total;
  if(run.review) return finishReview(right,total);
  const lv=run.lv; let s;
  if(lv.t==='teach') s=3; else { s=1; if(acc>=.8) s=2; if(acc===1 && !run.hintUsed) s=3; }
  const prev=stars(lv.id), best=Math.max(prev,s);
  const wasOpen = ZONES.map(z=>zoneOpen(z));
  me.stars[lv.id]=best; save();
  cloudLog({type:'關卡', zone:`區${lv.zone.no} ${lv.zone.bld}`, level:lv.name, kind:TYPE_LABEL[lv.t], stars:s, best, right, total, hint:run.hintUsed?'是':'否', wrong:[...new Set(run.items.filter(it=>run.score[it.uid]===false).flatMap(itemSyms))].join(' ')});
  const z=lv.zone, i=z.levels.indexOf(lv), nxt=z.levels[i+1];
  const newly = ZONES.find((zz,k)=>!wasOpen[k] && zoneOpen(zz));
  const nextZone = ZONES[ZONES.indexOf(z)+1];
  const tg = nextTarget(); const nextHint = tg ? `下一關在${HOST[tg.id].loc}，去找${HOST[tg.id].name}吧！跟著地圖上的黃色「！」走。` : '';
  const msg = s===3?'滿分過關！':s===2?'很不錯！':'過關了！';
  const why = lv.t==='teach' ? '教學關完成就有 3 顆星。'
    : s===3 ? '全對又沒看提示。'
    : s===2 ? (acc===1 ? '全對，但有看提示。不看提示全對就能拿 3 顆星。' : '正確率 80% 以上。全對又不看提示就能拿 3 顆星。')
    : '正確率還沒到 80%，重玩可以把星星補起來。';
  cheer(true);
  openSheet(`<div class="result">
    <div class="big-stars">${[0,1,2].map(k=>k<s?STAR(true).replace('<svg','<svg class="got"'):STAR(false)).join('')}</div>
    <h2>${msg}</h2>
    <p style="font-size:19px">答對 ${right} / ${total} 題（第一次就答對才算）</p>
    <p class="muted">${why}</p>
    <p class="muted">最高紀錄：<b style="color:var(--gold-dk)">${starText(best)}</b>${best>prev&&prev>0?'　刷新紀錄！':''}${best>prev?`　本節 +${best-prev} ★`:''}</p>
    ${nextHint?`<p style="font-family:var(--display);font-size:19px">${nextHint}</p>`:''}
    ${lv.t==='boss' && nextZone ? `<p style="font-family:var(--display);font-size:20px;color:${nextZone.hex}">${nextZone.soon?`${nextZone.bld}還在施工中，下次上課見！`:newly?`${nextZone.bld}開門了！走過去看看吧`:''}</p>`:''}
    <div class="actions">
      <button class="px-btn" id="r-again">再挑戰一次</button>
      <button class="px-btn go" id="r-map">回到校園${nextHint?'，找下一關':''}</button>
    </div></div>`);
  $('#r-again').onclick=()=>startLevel(lv);
  $('#r-map').onclick=closeSheet;
  run=null; renderHud();
}
function finishReview(right,total){
  const wk=weekKey(), gains=[];
  const rows = run.items.map(it=>{
    const ok=run.score[it.uid]===true;
    if(ok && run.counts){ const arr=me.medals[it.sym]=me.medals[it.sym]||[]; if(!arr.includes(wk)){ const b=Math.min(arr.length,3); arr.push(wk); const a=Math.min(arr.length,3); if(a>b) gains.push([it.sym,a]); } }
    return `<span class="rv-item ${ok?'ok':'no'}">${it.ans}　${ok?'記得':'忘了'}</span>`; }).join('');
  const counted = run.counts; save();
  cloudLog({type:'今日複習', zone:'前庭布告欄', level:'今日複習挑戰', kind:counted?'計分':'練習', stars:'', best:'', right, total, hint:'否', wrong:run.items.filter(it=>run.score[it.uid]!==true).map(it=>it.ans).join(' ')});
  const gainTxt = gains.map(([s,l])=>`${s==='（）'?'括號':SYMNAME[s]}升級為${['','銅','銀','金'][l]}牌`).join('、');
  openSheet(`<div class="result"><h2>複習完成</h2>
    <p style="font-size:19px">記得 ${right} / ${total} 個符號</p>
    <div class="rv-list">${rows}</div>
    <p style="font-family:var(--display);font-size:19px;color:var(--gold-dk)">${counted ? (gainTxt ? '勳章升級：'+gainTxt : '這週已經記錄過這些符號了，下週再來挑戰升級！') : '今天已經計過分，這次是練習。'}</p>
    <p class="muted">忘記的符號，之後會更常出現在複習和魔王關。</p>
    <div class="actions"><button class="px-btn go" id="r-map">回到校園</button></div></div>`);
  $('#r-map').onclick=closeSheet; run=null; renderHud();
}

showLogin();
</script>

</body></html>
